<!doctype html>
<meta charset="utf-8">
<title>Todo tests</title>
<pre id="out">running</pre>
<script type="module">
const out = document.querySelector("#out");
const log = [];
const check = (name, ok, detail = "") => log.push(`${ok ? "PASS" : "FAIL"} ${name}${detail ? " :: " + detail : ""}`);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

function loadFrame() {
  return new Promise((resolve) => {
    const f = document.createElement("iframe");
    f.src = "index.html";
    f.onload = async () => { await wait(300); resolve(f.contentDocument); };
    document.body.append(f);
  });
}

try {
  await new Promise((r) => { const q = indexedDB.deleteDatabase("todo-app"); q.onsuccess = q.onerror = q.onblocked = r; });
  let doc = await loadFrame();
  check("empty state shown", !doc.querySelector("#empty").hidden);

  const add = async (title) => {
    doc.querySelector("#new-task-title").value = title;
    doc.querySelector("#new-task").requestSubmit();
    await wait(200);
  };
  await add("   ");
  await add("Buy milk");
  await add("  Write <b>report</b>  ");
  let items = [...doc.querySelectorAll(".task")];
  check("two tasks added, blank ignored", items.length === 2, String(items.length));
  check("titles trimmed and not parsed as HTML", items[1].querySelector("span").textContent === "Write <b>report</b>" && !items[1].querySelector("b"));
  check("input cleared after add", doc.querySelector("#new-task-title").value === "");
  check("empty state hidden", doc.querySelector("#empty").hidden);
  check("count", doc.querySelector("#count").textContent === "2 of 2 left", doc.querySelector("#count").textContent);

  items[0].querySelector("input[type=checkbox]").click();
  await wait(200);
  items = [...doc.querySelectorAll(".task")];
  check("mark done", items[0].classList.contains("done") && items[0].querySelector("input").checked);
  check("count after done", doc.querySelector("#count").textContent === "1 of 2 left", doc.querySelector("#count").textContent);

  items[1].querySelector(".delete").click();
  await wait(200);
  items = [...doc.querySelectorAll(".task")];
  check("delete", items.length === 1 && items[0].querySelector("span").textContent === "Buy milk");

  document.querySelector("iframe").remove();
  doc = await loadFrame();
  items = [...doc.querySelectorAll(".task")];
  check("persists across reload", items.length === 1 && items[0].classList.contains("done"));

  items[0].querySelector("input[type=checkbox]").click();
  await wait(200);
  check("unmark done", !doc.querySelector(".task").classList.contains("done"));
} catch (e) {
  check("no exceptions", false, e && e.stack || String(e));
}
out.textContent = "DONE\n" + log.join("\n");
</script>
